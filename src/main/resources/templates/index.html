<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eng">
<head>
    <title>Food List</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<nav class="nav-bar">
    <a href="/">
        <h1>Food List</h1>
    </a>
    <ul>
        <li><a href="/add-food">Add Food</a></li>
        <li><a href="#about">View Orders</a></li>
    </ul>
</nav>

<div class="container">
    <div class="food-item" th:each="food : ${foodItems}" th:attr="data-name=${food.foodName}">
        <h2 th:text="${food.foodName}">Food Name</h2>
        <p th:text="'Price: ₦' + ${food.foodPrice}">Food Price</p>
    </div>
</div>

<div class="modal" id="foodModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('foodModal')">&times;</span>
        <h2 id="foodName">Food Name</h2>
        <p id="foodPrice">Food Price</p>
        <button class="edit-button" onclick="openEditModal()">Edit</button>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editFoodModal" style="display:none;">
    <div class="modal-content">
        <span class="close" onclick="closeModal('editFoodModal')">&times;</span>
        <h2>Edit Food Item</h2>
        <form id="editFoodForm">
            <input type="hidden" id="editFoodId">
            <label for="editFoodName">Food Name:</label>
            <input type="text" id="editFoodName" required><br>
            <label for="editFoodPrice">Price:</label>
            <input type="number" id="editFoodPrice" required><br>
            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>

<!-- Pagination Controls -->
<div class="pagination">
    <!-- Previous button -->
    <a th:if="${currentPage > 0}"
       th:href="@{/(pageNumber=${currentPage - 1}, pageSize=${pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Previous</a>

    <!-- Current page display -->
    <span>Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span></span>

    <!-- Next button -->
    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/(pageNumber=${currentPage + 1}, pageSize=${pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Next</a>
</div>

<script>
    // Existing functionality to display food details in the modal
    document.querySelectorAll('.food-item').forEach(item => {
        item.addEventListener('click', function() {
            const foodName = this.getAttribute('data-name');
            fetch(`/${foodName}`) // Fetch food details from the server
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Food item not found');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data) {
                        // Populate food details in the view modal
                        document.getElementById('foodName').textContent = data.foodName;
                        document.getElementById('foodPrice').textContent = 'Price: ₦' + data.foodPrice;

                        // Prepare edit modal with food details
                        document.getElementById('editFoodId').value = data.id;
                        document.getElementById('editFoodName').value = data.foodName;
                        document.getElementById('editFoodPrice').value = data.foodPrice;

                        // Show the food details modal
                        document.getElementById('foodModal').style.display = 'flex';
                    }
                })
                .catch(error => {
                    console.error('Error fetching food item:', error);
                    alert('Food item not found.');
                });
        });
    });

    // Function to open the edit modal
    function openEditModal() {
        document.getElementById('foodModal').style.display = 'none'; // Close the current details modal
        document.getElementById('editFoodModal').style.display = 'flex'; // Open the edit modal
    }

    // Function to close any modal
    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // Function to handle the edit form submission
    document.getElementById('editFoodForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent default form submission

        const foodId = document.getElementById('editFoodId').value;
        const foodName = document.getElementById('editFoodName').value;
        const foodPrice = document.getElementById('editFoodPrice').value;

        console.log(foodId, foodName, foodPrice)

        fetch(`/api/v1/food/update-food/${foodId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                foodName: foodName,
                foodPrice: foodPrice
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Error updating food item');
            }
            return response.json();
        })
        .then(data => {
            if (data.message === "Food details has updated") {
                alert('Food item updated successfully');
                location.reload(); // Reload the page to reflect the changes
            } else {
                alert(data.message);
            }
        })
        .catch(error => {
            console.error('Error updating food item:', error);
            alert('Error updating food item.');
        });
    });
</script>
</body>
</html>
